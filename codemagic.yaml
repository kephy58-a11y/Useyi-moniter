workflows:
  build-apk:
    name: Build APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate platform folders (safe to run even if they already exist)
        script: |
          flutter create --platforms=android .
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/**/*.apk
