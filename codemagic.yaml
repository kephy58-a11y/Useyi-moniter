workflows:
  useyi-monitor-android:
    name: USEYI Monitor - Android
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate Android/iOS platform folders
        script: |
          flutter create --platforms=android,ios .
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/**/*.apk

  useyi-monitor-ios:
    name: USEYI Monitor - iOS
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate Android/iOS platform folders
        script: |
          flutter create --platforms=android,ios .
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build iOS app (unsigned)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
